<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your submission — Virtual Suggestion Box</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
</head>
<body>

<div class="card" id="card">
  <p class="subtitle">Loading…</p>
</div>

<script>
const token = window.location.pathname.split('/').filter(Boolean).pop();
const card = document.getElementById('card');

async function loadSubmission() {
  let res;
  try {
    res = await fetch(`/api/edit/${token}`);
  } catch {
    card.innerHTML = `<p class="error-msg visible">Couldn't reach the server. Try again shortly.</p>`;
    return;
  }

  if (res.status === 410) {
    card.innerHTML = `<h1>Link expired</h1><p class="subtitle">This link is no longer available — it expires 24hrs after submitting.</p>`;
    return;
  }
  if (!res.ok) {
    card.innerHTML = `<h1>Not found</h1><p class="subtitle">This link isn't valid.</p>`;
    return;
  }

  const submission = await res.json();
  renderSubmission(submission);
}

function renderSubmission(submission) {
  const hasSuggestion = !!submission.suggestion_text;
  const hasNomination = Array.isArray(submission.nominees) && submission.nominees.length > 0;
  const hasSurveyAnswers = Array.isArray(submission.survey_answers) && submission.survey_answers.length > 0;
  const isBoth = hasSuggestion && hasNomination;
  const when = new Date(submission.created_at).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const who = submission.is_anonymous
    ? 'Submitted anonymously'
    : 'Submitted' + (submission.submitter_name ? ` by ${escapeHtml(submission.submitter_name)}` : '');

  let body = '';
  if (hasSuggestion) {
    body += `<div class="field-label">Suggestion</div><div style="margin-bottom:20px; white-space:pre-wrap;">${escapeHtml(submission.suggestion_text)}</div>`;
  }
  if (hasNomination) {
    submission.nominees.forEach(n => {
      body += `<div class="field-label">${escapeHtml(n.name)}${n.role ? ' · ' + escapeHtml(n.role) : ''}</div><div style="margin-bottom:20px; white-space:pre-wrap;">${n.reason ? escapeHtml(n.reason) : '<span class="hint">No reason given</span>'}</div>`;
    });
    if (submission.nomination_reason) {
      body += `<div class="field-label">Reason</div><div style="margin-bottom:20px; white-space:pre-wrap;">${escapeHtml(submission.nomination_reason)}</div>`;
    }
  }
  if (hasSurveyAnswers) {
    body += submission.survey_answers.map(a => `
      <div class="field-label">${escapeHtml(a.question_text)}</div>
      <div style="margin-bottom:20px; white-space:pre-wrap;">${escapeHtml(a.answer_text)}</div>
    `).join('');
  }

  card.innerHTML = `
    <div class="stamp stamp-icon" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
    <div class="tag-row"><span class="tag-chip">${isBoth ? 'Suggestion + nomination' : (hasNomination ? 'Nomination' : (hasSurveyAnswers && !hasSuggestion ? 'Survey' : 'Suggestion'))}</span></div>
    <h1>Your submission</h1>
    <p class="subtitle">${who} · ${when}</p>

    ${body}
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadSubmission();
</script>

</body>
</html>
