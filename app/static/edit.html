<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your submission — Virtual Suggestion Box</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
</head>
<body>

<div class="card" id="card">
  <p class="subtitle">Loading…</p>
</div>

<script>
const token = window.location.pathname.split('/').filter(Boolean).pop();
const card = document.getElementById('card');

async function loadSubmission() {
  let res;
  try {
    res = await fetch(`/api/edit/${token}`);
  } catch {
    card.innerHTML = `<p class="error-msg visible">Couldn't reach the server. Try again shortly.</p>`;
    return;
  }

  if (res.status === 410) {
    card.innerHTML = `<h1>Link expired</h1><p class="subtitle">This link is no longer available — it expires 24hrs after submitting.</p>`;
    return;
  }
  if (!res.ok) {
    card.innerHTML = `<h1>Not found</h1><p class="subtitle">This link isn't valid.</p>`;
    return;
  }

  const submission = await res.json();
  renderSubmission(submission);
}

function renderSubmission(submission) {
  const hasSuggestion = !!submission.suggestion_text;
  const hasNomination = Array.isArray(submission.nominees) && submission.nominees.length > 0;
  const isBoth = hasSuggestion && hasNomination;
  const statusLabels = { new: 'New', reviewed: 'Reviewed', done: 'Done' };
  const when = new Date(submission.created_at).toLocaleString();
  const who = submission.is_anonymous
    ? 'Submitted anonymously'
    : 'Submitted' + (submission.submitter_name ? ` by ${escapeHtml(submission.submitter_name)}` : '');

  let body = '';
  if (hasSuggestion) {
    body += `<div class="field-label">Suggestion</div><div style="margin-bottom:20px; white-space:pre-wrap;">${escapeHtml(submission.suggestion_text)}</div>`;
  }
  if (hasNomination) {
    const chips = submission.nominees.map(n => `<span class="nominee-chip">${escapeHtml(n.name)}${n.role ? ' · ' + escapeHtml(n.role) : ''}</span>`).join('');
    body += `<div class="field-label">Nominees</div><div style="margin-bottom:14px;">${chips}</div>`;
    if (submission.nomination_reason) {
      body += `<div class="field-label">Reason</div><div style="margin-bottom:20px; white-space:pre-wrap;">${escapeHtml(submission.nomination_reason)}</div>`;
    }
  }

  card.innerHTML = `
    <div class="stamp">${statusLabels[submission.status] || submission.status}</div>
    <p class="eyebrow">${isBoth ? 'Suggestions & recognition' : (hasNomination ? 'Employee recognition' : 'Idea box')}</p>
    <h1>Your submission</h1>
    <p class="subtitle">${who} · ${when}</p>

    ${body}

    <p class="hint" style="display:block; margin-top:8px;">This is a read-only view — submissions can't be edited after they're sent. This link expires 24hrs after submitting.</p>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadSubmission();
</script>

</body>
</html>
