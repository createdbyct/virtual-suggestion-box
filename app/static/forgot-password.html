<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Virtual Suggestion Box</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
</head>
<body>

<div class="card" id="card">
  <a href="/" style="font-family:'Fraunces',serif; font-weight:600; font-size:0.9rem; color:var(--muted); text-decoration:none; display:inline-block; margin-bottom:8px;">&larr; Virtual Suggestion Box</a>
  <div class="stamp">RESET</div>
  <p class="eyebrow">Account recovery</p>
  <h1>Forgot your password?</h1>
  <p class="subtitle">Enter your email or username and we'll get you a reset link.</p>

  <form id="forgot-form">
    <label for="identifier">Email or username</label>
    <input type="text" id="identifier" required>

    <p class="error-msg" id="error-msg"></p>
    <button type="submit" id="submit-btn">Get reset link</button>
  </form>

  <p class="timestamp" style="text-align:center; margin-top:18px;">
    <a href="/login" style="color: var(--accent);">Back to log in</a>
  </p>
</div>

<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error-msg');
  const btn = document.getElementById('submit-btn');
  errorEl.classList.remove('visible');

  const identifier = document.getElementById('identifier').value.trim();
  btn.disabled = true;
  btn.textContent = 'Working on it…';

  let res;
  try {
    res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier }),
    });
  } catch {
    showError('Network error — please try again.');
    return;
  }

  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    showError(data.detail || 'Something went wrong.');
    return;
  }

  const data = await res.json();
  const expires = new Date(data.expires_at);

  if (data.delivered_via === 'email') {
    document.getElementById('card').innerHTML = `
      <div class="confirmation">
        <div class="stamp-mark">✓</div>
        <h1>Check your email</h1>
        <p class="subtitle">A reset link is on its way to your email. It expires ${expires.toLocaleString()} and can only be used once.</p>
      </div>
    `;
    return;
  }

  const resetUrl = `${window.location.origin}${data.reset_url}`;

  document.getElementById('card').innerHTML = `
    <div class="confirmation">
      <div class="stamp-mark">✓</div>
      <h1>Here's your link</h1>
      <p class="subtitle">There's no email service set up on this install, so instead of emailing it, here's your reset link directly. Anyone with this link can reset this account's password, so treat it like a password itself.</p>
      <div class="edit-link-box">
        <div class="label">Reset link</div>
        <div class="edit-link-url"><a href="${resetUrl}" style="color:var(--ink);">${resetUrl}</a></div>
        <button class="copy-btn" id="copy-btn">Copy link</button>
        <p class="timestamp">Expires ${expires.toLocaleString()}</p>
      </div>
    </div>
  `;
  document.getElementById('copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(resetUrl);
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy link'; }, 1500);
  });
});

function showError(msg) {
  const errorEl = document.getElementById('error-msg');
  const btn = document.getElementById('submit-btn');
  errorEl.textContent = msg;
  errorEl.classList.add('visible');
  btn.disabled = false;
  btn.textContent = 'Get reset link';
}
</script>

</body>
</html>
