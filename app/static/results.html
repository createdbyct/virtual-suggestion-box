<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results — Virtual Suggestion Box</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
<script src="/static/analytics-view.js"></script>
</head>
<body>

<div class="page-top"><a href="/" class="page-brand-link">Virtual Suggestion Box</a></div>
<div class="card card-results" id="card">
  <p class="subtitle">Loading…</p>
</div>

<script>
const slug = window.location.pathname.split('/').filter(Boolean).pop();
const card = document.getElementById('card');

const QUESTION_TYPE_LABELS = {
  multiple_choice: 'Multiple choice',
  rating: 'Rating',
  short_text: 'Short text',
  yes_no: 'Yes / No',
};

async function load() {
  let formRes, analyticsRes;
  try {
    [formRes, analyticsRes] = await Promise.all([
      fetch(`/api/vb/${slug}`),
      fetch(`/api/vb/${slug}/analytics`),
    ]);
  } catch {
    card.innerHTML = `<p class="error-msg visible">Couldn't reach the server. Try again shortly.</p>`;
    return;
  }

  if (!formRes.ok) {
    card.innerHTML = `<h1>Not found</h1><p class="subtitle">This link doesn't point to a valid form.</p>`;
    return;
  }
  if (analyticsRes.status === 403) {
    card.innerHTML = `<h1>Results aren't public</h1><p class="subtitle">The owner of this form hasn't made its results public.</p>`;
    return;
  }
  if (!analyticsRes.ok) {
    card.innerHTML = `<h1>Something went wrong</h1><p class="subtitle">Couldn't load results — try again shortly.</p>`;
    return;
  }

  const form = await formRes.json();
  const data = await analyticsRes.json();
  render(form, data);
}

function render(form, data) {
  card.innerHTML = `
    <div class="stamp stamp-icon" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M7 19V9m5 10V5m5 14v-7"/></svg></div>
    <div class="tag-row"><span class="tag-chip">Results</span></div>
    <h1>${escapeHtml(form.title)}</h1>
    <p class="subtitle">${data.total_submissions} ${data.total_submissions === 1 ? 'person' : 'people'} responded</p>
    ${renderAnalyticsCards(data, 'This form has no questions yet.')}
  `;
  bindAnalyticsCards(card);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

load();
</script>

</body>
</html>
