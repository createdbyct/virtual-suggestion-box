<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit — Virtual Suggestion Box</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<a href="/" class="page-brand-link">Virtual Suggestion Box</a>
<div class="card" id="card">
  <p class="subtitle">Loading…</p>
</div>

<script>
const slug = window.location.pathname.split('/').filter(Boolean).pop();
const card = document.getElementById('card');
let nomineeCount = 0;

async function loadForm() {
  let res;
  try {
    res = await fetch(`/api/vb/${slug}`);
  } catch {
    card.innerHTML = `<p class="error-msg visible">Couldn't reach the server. Try again shortly.</p>`;
    return;
  }
  if (!res.ok) {
    card.innerHTML = `<h1>Not found</h1><p class="subtitle">This link doesn't point to a valid form.</p>`;
    return;
  }
  const form = await res.json();
  document.body.setAttribute('data-kind', form.type === 'nomination' ? 'nomination' : 'suggestion');
  renderForm(form);
}

function renderForm(form) {
  const showSuggestion = form.type === 'suggestion' || form.type === 'both';
  const showNomination = form.type === 'nomination' || form.type === 'both';
  const isBoth = form.type === 'both';
  const isSurveyOnly = form.type === 'survey';
  const stampEmoji = stampIcon(form.type);
  const genericSubtitle = isBoth
    ? 'Leave a suggestion, nominate a coworker, or both.'
    : isSurveyOnly
    ? 'Please answer the questions below.'
    : (form.type === 'nomination' ? "Recognize a coworker (or a few) who's earned it." : 'Tell us what would make things better.');
  const subtitleText = form.description || genericSubtitle;

  card.innerHTML = `
    <div class="stamp stamp-icon">${stampEmoji}</div>
    <button type="button" class="share-icon-btn" id="share-form-btn" aria-label="Share this form" title="Share this form">🔗</button>
    <p class="eyebrow">${isBoth ? 'Suggestions & recognition' : isSurveyOnly ? 'Survey' : (form.type === 'nomination' ? 'Employee recognition' : 'Idea box')}</p>
    <h1>${escapeHtml(form.title)}</h1>
    <p class="subtitle">${escapeHtml(subtitleText)}</p>

    <form id="submit-form">
      ${isBoth ? `
        <div class="section-toggle">
          <label class="toggle-option">
            <input type="checkbox" id="toggle-suggestion">
            <span>💡 I have a suggestion</span>
          </label>
          <label class="toggle-option">
            <input type="checkbox" id="toggle-nomination">
            <span>🏆 I want to nominate someone</span>
          </label>
        </div>
      ` : ''}

      <div class="panel ${isBoth ? 'hidden' : ''}" id="suggestion-panel" ${showSuggestion ? '' : 'style="display:none"'}>
        ${showSuggestion ? `
          <label for="suggestion_text">Your suggestion</label>
          <textarea id="suggestion_text" placeholder="What's the idea?"></textarea>
        ` : ''}
      </div>

      <div class="panel ${isBoth ? 'hidden' : ''}" id="nomination-panel" ${showNomination ? '' : 'style="display:none"'}>
        ${showNomination ? `
          <label>Who are you nominating? <span class="hint">— add as many as you like</span></label>
          <div class="nominees-list" id="nominees-list"></div>
          <button type="button" class="add-nominee-btn" id="add-nominee-btn">+ Add another nominee</button>
          <label for="nomination_reason">Why do they deserve it?</label>
          <textarea id="nomination_reason" placeholder="What did they do? Be specific — great nominations tell a quick story."></textarea>
        ` : ''}
      </div>

      <div class="optional-fields hidden" id="identity-fields">
        <label for="submitter_name">Your name <span class="hint">(optional)</span></label>
        <input type="text" id="submitter_name">

        <label for="submitter_email">Your email <span class="hint">(optional — lets you view your submission within 24hrs)</span></label>
        <input type="email" id="submitter_email">
      </div>
      <button type="button" class="link-btn" id="show-identity-btn" style="margin-top:14px;">+ Add your name and email</button>

      ${(form.survey_questions || []).length > 0 ? `
        <p class="section-title" style="margin-top:24px;">A few questions</p>
        ${form.survey_questions.map(q => renderQuestionField(q)).join('')}
      ` : ''}

      <p class="error-msg" id="error-msg"></p>
      <button type="submit" id="submit-btn">Submit</button>
    </form>
  `;

  document.getElementById('show-identity-btn').addEventListener('click', (e) => {
    document.getElementById('identity-fields').classList.remove('hidden');
    e.target.remove();
  });
  document.getElementById('share-form-btn').addEventListener('click', () => {
    const titleEl = document.querySelector('h1');
    showShareModal(window.location.href, titleEl ? titleEl.textContent : 'Form link');
  });

  if (showNomination) {
    addNomineeRow();
  }

  const addBtn = document.getElementById('add-nominee-btn');
  if (addBtn) addBtn.addEventListener('click', addNomineeRow);

  if (isBoth) {
    const toggleSuggestion = document.getElementById('toggle-suggestion');
    const toggleNomination = document.getElementById('toggle-nomination');
    const suggestionPanel = document.getElementById('suggestion-panel');
    const nominationPanel = document.getElementById('nomination-panel');

    toggleSuggestion.addEventListener('change', () => {
      suggestionPanel.classList.toggle('hidden', !toggleSuggestion.checked);
    });
    toggleNomination.addEventListener('change', () => {
      nominationPanel.classList.toggle('hidden', !toggleNomination.checked);
    });
  }

  document.getElementById('submit-form').addEventListener('submit', (e) => handleSubmit(e, isBoth));
}

function addNomineeRow() {
  nomineeCount++;
  const list = document.getElementById('nominees-list');
  const row = document.createElement('div');
  row.className = 'nominee-row';
  row.innerHTML = `
    <span class="nominee-number">Nominee ${nomineeCount}</span>
    <input type="text" class="nominee-name" placeholder="Name">
    <input type="text" class="nominee-role" placeholder="Role (optional)">
    <button type="button" class="remove-nominee" aria-label="Remove nominee">×</button>
  `;
  row.querySelector('.remove-nominee').addEventListener('click', () => {
    row.remove();
    renumberNominees();
  });
  list.appendChild(row);
}

function renumberNominees() {
  const rows = document.querySelectorAll('#nominees-list .nominee-row');
  rows.forEach((row, i) => {
    row.querySelector('.nominee-number').textContent = `Nominee ${i + 1}`;
  });
  nomineeCount = rows.length;
}

function collectNominees() {
  const rows = document.querySelectorAll('#nominees-list .nominee-row');
  return Array.from(rows).map(row => ({
    name: row.querySelector('.nominee-name').value.trim(),
    role: row.querySelector('.nominee-role').value.trim() || null,
  })).filter(n => n.name);
}

function collectSurveyAnswers() {
  const answers = [];
  const seen = new Set();

  // Short text: one input per question.
  document.querySelectorAll('.survey-answer-short-text').forEach(input => {
    const value = input.value.trim();
    if (value) answers.push({ question_id: parseInt(input.dataset.questionId), answer_text: value });
  });

  // Radio groups (multiple choice, rating, yes/no): only one checked
  // input per question_id actually matters, so skip already-seen ids.
  document.querySelectorAll('.survey-answer-radio:checked').forEach(input => {
    const qid = parseInt(input.dataset.questionId);
    if (seen.has(qid)) return;
    seen.add(qid);
    answers.push({ question_id: qid, answer_text: input.value });
  });

  return answers.length > 0 ? answers : null;
}

async function handleSubmit(e, isBoth) {
  e.preventDefault();
  const errorEl = document.getElementById('error-msg');
  const btn = document.getElementById('submit-btn');
  errorEl.classList.remove('visible');

  const includeSuggestion = isBoth
    ? document.getElementById('toggle-suggestion').checked
    : !!document.getElementById('suggestion_text');
  const includeNomination = isBoth
    ? document.getElementById('toggle-nomination').checked
    : !!document.getElementById('nomination_reason');

  if (isBoth && !includeSuggestion && !includeNomination) {
    showError('Pick at least one: a suggestion, a nomination, or both.');
    return;
  }

  const nominees = includeNomination ? collectNominees() : null;
  if (includeNomination && (!nominees || nominees.length === 0)) {
    showError('Add at least one nominee, or uncheck the nomination option.');
    return;
  }

  const payload = {
    suggestion_text: includeSuggestion ? document.getElementById('suggestion_text').value.trim() : null,
    nomination_reason: includeNomination ? document.getElementById('nomination_reason').value.trim() : null,
    nominees: nominees,
    submitter_name: document.getElementById('submitter_name').value.trim() || null,
    submitter_email: document.getElementById('submitter_email').value.trim() || null,
    survey_answers: collectSurveyAnswers(),
  };

  btn.disabled = true;
  btn.textContent = 'Submitting…';

  let res;
  try {
    res = await fetch(`/api/vb/${slug}/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  } catch {
    showError('Network error — please try again.');
    return;
  }

  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    showError(data.detail || 'Something went wrong.');
    return;
  }

  const data = await res.json();
  renderConfirmation(data);
}

function showError(msg) {
  const errorEl = document.getElementById('error-msg');
  const btn = document.getElementById('submit-btn');
  errorEl.textContent = msg;
  errorEl.classList.add('visible');
  btn.disabled = false;
  btn.textContent = 'Submit';
}

function renderConfirmation(data) {
  const editUrl = `${window.location.origin}${data.edit_url}`;
  card.innerHTML = `
    <div class="confirmation">
      <div class="stamp-mark">✓</div>
      <h1>Thanks — got it.</h1>
      <p class="subtitle">Your submission has been received.</p>
      <div class="edit-link-box">
        <a href="${editUrl}" class="link-btn" style="width:100%; justify-content:center;">View your submission</a>
      </div>
    </div>
  `;
}

function renderQuestionField(q) {
  const requiredMark = q.required ? ' <span style="color:var(--error);">*</span>' : '';
  const requiredAttr = q.required ? 'required' : '';

  if (q.question_type === 'short_text') {
    return `
      <label for="q-${q.id}">${escapeHtml(q.question_text)}${requiredMark}</label>
      <input type="text" id="q-${q.id}" data-question-id="${q.id}" class="survey-answer-short-text" ${requiredAttr}>
    `;
  }
  if (q.question_type === 'yes_no') {
    return `
      <label>${escapeHtml(q.question_text)}${requiredMark}</label>
      <div class="section-toggle" style="margin-bottom:14px;">
        <label class="toggle-option">
          <input type="radio" name="q-${q.id}" value="Yes" data-question-id="${q.id}" class="survey-answer-radio" ${requiredAttr}>
          <span>Yes</span>
        </label>
        <label class="toggle-option">
          <input type="radio" name="q-${q.id}" value="No" data-question-id="${q.id}" class="survey-answer-radio" ${requiredAttr}>
          <span>No</span>
        </label>
      </div>
    `;
  }
  if (q.question_type === 'rating') {
    const stars = [1, 2, 3, 4, 5].map(n => `
      <label class="toggle-option" style="flex:1; justify-content:center; text-align:center;">
        <input type="radio" name="q-${q.id}" value="${n}" data-question-id="${q.id}" class="survey-answer-radio" ${requiredAttr}>
        <span>${n}</span>
      </label>
    `).join('');
    return `
      <label>${escapeHtml(q.question_text)}${requiredMark}</label>
      <div class="section-toggle" style="margin-bottom:14px;">${stars}</div>
    `;
  }
  if (q.question_type === 'multiple_choice') {
    const opts = (q.options || []).map(o => `
      <label class="toggle-option">
        <input type="radio" name="q-${q.id}" value="${escapeAttr(o)}" data-question-id="${q.id}" class="survey-answer-radio" ${requiredAttr}>
        <span>${escapeHtml(o)}</span>
      </label>
    `).join('');
    return `
      <label>${escapeHtml(q.question_text)}${requiredMark}</label>
      <div class="section-toggle" style="flex-direction:column; align-items:stretch; margin-bottom:14px;">${opts}</div>
    `;
  }
  return '';
}

function stampIcon(type) {
  if (type === 'suggestion') return '💡';
  if (type === 'nomination') return '🏆';
  if (type === 'survey') return '📊';
  return '📋';
}

function showToast(message) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.classList.add('visible');
  clearTimeout(toast._hideTimer);
  toast._hideTimer = setTimeout(() => toast.classList.remove('visible'), 2200);
}

function showShareModal(url, title) {
  const existing = document.getElementById('qr-modal-overlay');
  if (existing) existing.remove();

  const hasNativeShare = !!navigator.share;

  const overlay = document.createElement('div');
  overlay.id = 'qr-modal-overlay';
  overlay.className = 'qr-modal-overlay';
  overlay.innerHTML = `
    <div class="qr-modal">
      <button type="button" class="qr-modal-close" id="qr-modal-close" aria-label="Close">×</button>
      <p class="eyebrow" style="text-align:center;">Share this form</p>
      <h1 style="text-align:center; font-size:1.15rem;">${escapeHtml(title || 'Form link')}</h1>
      <div id="qr-modal-code" style="display:flex; justify-content:center; margin:18px 0; background:#fff; padding:16px; border-radius:8px;"></div>
      <button type="button" class="link-btn" id="modal-copy-link" style="width:100%; justify-content:center; margin-bottom:8px;">🔗 Copy link</button>
      ${hasNativeShare ? `<button type="button" class="link-btn" id="modal-native-share" style="width:100%; justify-content:center; margin-bottom:8px;">📤 Share via…</button>` : ''}
      <button type="button" class="link-btn" id="modal-download-qr" style="width:100%; justify-content:center;">⬇ Download QR image</button>
    </div>
  `;
  document.body.appendChild(overlay);

  new QRCode(document.getElementById('qr-modal-code'), {
    text: url,
    width: 200,
    height: 200,
    colorDark: '#000000',
    colorLight: '#ffffff',
  });

  const close = () => overlay.remove();
  document.getElementById('qr-modal-close').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

  document.getElementById('modal-copy-link').addEventListener('click', () => {
    navigator.clipboard.writeText(url);
    showToast('Link copied — ready to share');
  });

  if (hasNativeShare) {
    document.getElementById('modal-native-share').addEventListener('click', async () => {
      try {
        await navigator.share({ title, url });
      } catch (err) {
        // AbortError just means the person cancelled the native share sheet.
        if (err.name !== 'AbortError') {
          navigator.clipboard.writeText(url);
          showToast('Link copied — ready to share');
        }
      }
    });
  }

  document.getElementById('modal-download-qr').addEventListener('click', () => {
    const container = document.getElementById('qr-modal-code');
    const canvas = container.querySelector('canvas');
    const img = container.querySelector('img');
    const dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
    if (!dataUrl) return;
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'form-qr-code.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadForm();
</script>

</body>
</html>
