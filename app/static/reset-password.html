<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Virtual Suggestion Box</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
</head>
<body>

<div class="card" id="card">
  <p class="subtitle">Loading…</p>
</div>

<script>
const token = window.location.pathname.split('/').filter(Boolean).pop();
const card = document.getElementById('card');

async function init() {
  let res;
  try {
    res = await fetch(`/api/auth/reset-password/${token}`);
  } catch {
    card.innerHTML = `<p class="error-msg visible">Couldn't reach the server. Try again shortly.</p>`;
    return;
  }
  const data = await res.json();

  if (!data.valid) {
    card.innerHTML = `
      <div class="stamp">EXPIRED</div>
      <h1>This link isn't valid</h1>
      <p class="subtitle">It may have already been used, or it's expired. Request a new one.</p>
      <a href="/forgot-password" class="home-btn-primary" style="display:inline-block; margin-top:8px;">Request a new link</a>
    `;
    return;
  }

  renderForm(data.username);
}

function renderForm(username) {
  card.innerHTML = `
    <div class="stamp">RESET</div>
    <p class="eyebrow">Account recovery</p>
    <h1>Choose a new password</h1>
    <p class="subtitle">${username ? `For account <strong>@${escapeHtml(username)}</strong>.` : ''} You'll be logged out everywhere else after this.</p>

    <form id="reset-form">
      <label for="new_password">New password <span class="hint">(at least 8 characters)</span></label>
      <input type="password" id="new_password" required minlength="8">

      <p class="error-msg" id="error-msg"></p>
      <button type="submit" id="submit-btn">Reset password</button>
    </form>
  `;

  document.getElementById('reset-form').addEventListener('submit', handleSubmit);
}

async function handleSubmit(e) {
  e.preventDefault();
  const errorEl = document.getElementById('error-msg');
  const btn = document.getElementById('submit-btn');
  errorEl.classList.remove('visible');

  const newPassword = document.getElementById('new_password').value;
  btn.disabled = true;
  btn.textContent = 'Resetting…';

  let res;
  try {
    res = await fetch(`/api/auth/reset-password/${token}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ new_password: newPassword }),
    });
  } catch {
    showError('Network error — please try again.');
    return;
  }

  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    showError(data.detail || 'Something went wrong.');
    return;
  }

  card.innerHTML = `
    <div class="confirmation">
      <div class="stamp-mark">✓</div>
      <h1>Password reset</h1>
      <p class="subtitle">You can log in with your new password now.</p>
      <a href="/login" class="home-btn-primary" style="display:inline-block; margin-top:14px;">Go to log in</a>
    </div>
  `;
}

function showError(msg) {
  const errorEl = document.getElementById('error-msg');
  const btn = document.getElementById('submit-btn');
  errorEl.textContent = msg;
  errorEl.classList.add('visible');
  btn.disabled = false;
  btn.textContent = 'Reset password';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

init();
</script>

</body>
</html>
